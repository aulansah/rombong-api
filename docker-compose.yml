name: rombong-api

services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      APP_PORT: "8080"
      LOG_LEVEL: info
      AUTO_MIGRATE: "true" # migrations run on startup, before the server listens
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: ecommerce
      DB_SSLMODE: disable
      REDIS_ADDR: redis:6379
      # Override JWT_SECRET and the admin password outside local development.
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-please-32}
      CORS_ALLOW_ORIGINS: http://localhost:3000
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin12345}
      # Real payments: PAYMENT_PROVIDER=midtrans MIDTRANS_SERVER_KEY=SB-Mid-server-... docker compose up
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-simulated}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_PRODUCTION: ${MIDTRANS_PRODUCTION:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the ecommerce_test database used by the integration tests.
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
