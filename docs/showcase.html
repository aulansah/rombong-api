 function apply(id,r){const b=r.res_body||{};const ok=r.status<300;st.err=null;st.flash=null;st.fieldErr=null;
  switch(id){
   case"login":st.screen="catalog";st.cartCount=0;say("Selamat datang, Auldy");break;
   case"login-wrong":st.err=b.message;break;
   case"me":say("Profil: "+b.data.name+" ("+b.data.role+")");break;
   case"register":st.flash="Akun dibuat. Silakan masuk.";break;
   case"register-dup":st.err=b.message;break;
   case"register-weak":st.err=b.message;st.fieldErr={};(b.error.details||[]).forEach(d=>st.fieldErr[d.field]=d.message);break;
   case"products":case"products-cached":st.list=b.data;st.cat=null;st.search="";if(st.screen!=="catalog")st.screen="catalog";break;
   case"search":st.search="kopi";st.list=b.data;st.cat=null;break;
   case"filter":st.cat="Makanan Ringan";st.search="";st.list=b.data;break;
   case"detail":case"detail-cached":st.detail=b.data;st.screen="detail";break;
   case"cart-add":case"cart-add-2":case"cart-update":st.cart=b.data;st.cartCount=b.data.total_items;if(id==="cart-add"){st.screen="cart";}break;
   case"cart-over":st.err=b.message+" (dikembalikan ke 3)";st.over=true;break;
   case"checkout":st.order=b.data;st.screen="order";st.cartCount=0;say("Pesanan "+b.data.order_number+" dibuat");break;
   case"checkout-again":st.err="Tap kedua ditolak: "+b.message;break;
   case"cart-empty":st.cart=b.data;st.screen="cart";break;
   case"product-after":st.detail=b.data;st.screen="detail";say("Stok sekarang "+b.data.stock);break;
   case"pay":st.payment=b.data;say("Pembayaran dibuat: "+b.data.reference);break;
   case"pay-replay":st.payment=b.data;say("Server mengembalikan pembayaran yang SAMA");break;
   case"pay-other-key":say("Ditolak: "+b.message);break;
   case"pay-success":case"pay-success-again":st.payment=b.data;st.screen="payment";break;
   case"order-paid":st.order=b.data;st.screen="order";break;
   case"orders":st.screen="orders";break;
   case"race-a":st.raceA=ok?"berhasil, "+b.data.order_number:b.message;break;
   case"race-b":st.raceB=b.message;break;
   case"race-product":st.race=b.data;break;
   case"cart-nologin":st.log=[...(st.log||[]),["e","401 "+b.message]];break;
   case"expired":st.log=[...(st.log||[]),["e","401 token kedaluwarsa → interceptor refresh…"]];setTimeout(()=>run("refresh"),900);break;
   case"refresh":st.log=[...(st.log||[]),["ok","Token baru diterima, request diulang otomatis ✓"]];break;
   case"refresh-reuse":st.log=[...(st.log||[]),["e","401 "+b.message+" → semua sesi dicabut, kembali ke login"]];break;
   case"admin-forbidden":st.err="Customer: "+b.message;break;
   case"admin-process":st.order=b.data;st.flash="Status → "+b.data.status;break;
   case"admin-invalid":st.err=b.message;break;
   case"admin-stock":st.luwak=b.data.stock;st.flash="Stok Kopi Luwak → "+b.data.stock;break;
   case"health":say("Backend sehat: database "+b.database+", redis "+b.redis);break;
  }
  render();}

/* ---------- navigation & scaling ---------- */
let cur=0;
const slides=[...document.querySelectorAll(".slide")];
function fit(){const s=Math.min(innerWidth/1080,(innerHeight-24)/1350);slides.forEach(x=>{x.style.transform=`scale(${s})`;x.style.setProperty("--s",s);});}
function show(i){cur=(i+N)%N;slides.forEach((x,k)=>x.classList.toggle("on",k===cur));try{history.replaceState(null,"","#"+(cur+1));}catch(e){}}
document.addEventListener("click",e=>{if(e.target.closest(".next"))show(cur+1);else if(e.target.closest(".prev"))show(cur-1);else{const d=e.target.closest(".dots i");if(d)show(+d.dataset.k);}});
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")show(cur+1);if(e.key==="ArrowLeft")show(cur-1);});
let sx=null;document.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;},{passive:true});
document.addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>60&&!e.target.closest(".scroll,.cbody"))show(cur+(dx<0?1:-1));sx=null;});
addEventListener("resize",fit);fit();
