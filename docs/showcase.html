.screen{font-family:"Plus Jakarta Sans","Segoe UI",sans-serif}

:root{--bg0:#070B1A;--bg1:#0B1230;--line:#1E2A55;--blue:#3B82F6;--blue2:#60A5FA;--purple:#8B5CF6;--green:#22C55E;--amber:#F59E0B;--red:#EF4444;--ink:#E6EBFF;--muted:#8A96C0;
--app-pri:#D9541E;--app-pri-s:#FDE6D8;--app-bg:#FBF7F2;--app-line:#E8DED2;--app-ink:#1F1A17;--app-muted:#6B6159}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#03050C;overflow:hidden;font-family:"Inter","Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}
.mono{font-family:"JetBrains Mono","SFMono-Regular",Consolas,monospace}
.serif{font-family:Georgia,"Times New Roman",serif}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.slide{position:absolute;width:1080px;height:1350px;transform-origin:center center;background:radial-gradient(1200px 700px at 85% 110%,rgba(139,92,246,.22),transparent 60%),radial-gradient(900px 600px at -10% -10%,rgba(59,130,246,.18),transparent 60%),linear-gradient(180deg,#0A1130,#070B1A);
 border:1px solid #23306A;border-radius:6px;overflow:hidden;display:none}
.slide.on{display:block;animation:sIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes sIn{from{opacity:0;transform:translateX(30px) scale(var(--s))}to{opacity:1;transform:translateX(0) scale(var(--s))}}
.slide::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(96,165,250,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(96,165,250,.05) 1px,transparent 1px);background-size:54px 54px;pointer-events:none}
.frame{position:absolute;inset:22px;border:1px solid rgba(96,165,250,.28);border-radius:4px;pointer-events:none}
.plus{position:absolute;color:#4C6FD8;font-size:26px;line-height:1}
.hdr{position:absolute;top:44px;left:52px;right:52px;display:flex;align-items:center;gap:16px}
.ava{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#D9541E,#8B5CF6);border:3px solid #6E56CF;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;color:#fff}
.who b{display:block;font-size:24px;font-weight:500;font-family:Georgia,serif}.who span{color:#7C6CF0;font-size:15px}
.pill{margin-left:auto;border:2px solid var(--blue);border-radius:8px;padding:8px 16px;font-size:15px;letter-spacing:1.5px;display:flex;gap:10px;align-items:center}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--blue2);box-shadow:0 0 10px var(--blue2)}
.tag{position:absolute;top:150px;left:52px;border:1px solid #1F7A4B;background:rgba(34,197,94,.08);color:#4ADE80;font-size:13px;letter-spacing:2px;padding:6px 14px;border-radius:4px}
.title{position:absolute;top:186px;left:52px;right:52px;font-size:54px;font-weight:500;letter-spacing:-.5px;line-height:1.15}
.title small{display:block;font-size:20px;color:var(--muted);font-weight:400;margin-top:8px;letter-spacing:0}
.body{position:absolute;top:320px;left:52px;right:52px;bottom:150px;display:grid;grid-template-columns:400px minmax(0,1fr);gap:34px}
.body.full{display:block}
.phonebox{border:2px solid #2D5BD8;border-radius:22px;padding:18px;background:rgba(10,18,48,.6);display:flex;flex-direction:column;align-items:center;box-shadow:0 0 0 1px rgba(59,130,246,.15),0 20px 60px rgba(0,0,0,.4)}
.cap{margin-top:12px;font-size:13px;letter-spacing:2px;color:#5E8BFF}
.right{display:flex;flex-direction:column;gap:18px;min-height:0;min-width:0}
.card{border:2px solid var(--c);border-left-width:6px;border-radius:6px;padding:16px 20px;background:rgba(8,14,40,.75)}
.card .ch{font-size:14px;letter-spacing:1.6px;color:var(--c);display:flex;gap:10px;align-items:center;text-transform:uppercase}
.card h4{font-family:Georgia,serif;font-weight:400;font-size:24px;margin:8px 0 6px;color:#F1F4FF}
.card p{margin:0;font-size:13.5px;color:#9AA6D6;line-height:1.6}
.codeline{border:2px solid #2B3A7A;border-radius:6px;padding:12px 18px;font-size:14px;color:#7DD3FC;background:rgba(5,10,30,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* console */
.console{flex:1;min-height:0;border:2px solid #2D5BD8;border-radius:8px;background:#050A1C;display:flex;flex-direction:column;overflow:hidden}
.cbar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid #1C2754;font-size:13px;color:#8FA2E8;letter-spacing:1px}
.cbar .d{width:10px;height:10px;border-radius:50%}
.cbar .live{margin-left:auto;color:#4ADE80;font-size:12px}

 function apply(id,r){const b=r.res_body||{};const ok=r.status<300;st.err=null;st.flash=null;st.fieldErr=null;
  switch(id){
   case"login":st.screen="catalog";st.cartCount=0;say("Selamat datang, Auldy");break;
   case"login-wrong":st.err=b.message;break;
   case"me":say("Profil: "+b.data.name+" ("+b.data.role+")");break;
   case"register":st.flash="Akun dibuat. Silakan masuk.";break;
   case"register-dup":st.err=b.message;break;
   case"register-weak":st.err=b.message;st.fieldErr={};(b.error.details||[]).forEach(d=>st.fieldErr[d.field]=d.message);break;
   case"products":case"products-cached":st.list=b.data;st.cat=null;st.search="";if(st.screen!=="catalog")st.screen="catalog";break;
   case"search":st.search="kopi";st.list=b.data;st.cat=null;break;
   case"filter":st.cat="Makanan Ringan";st.search="";st.list=b.data;break;
   case"detail":case"detail-cached":st.detail=b.data;st.screen="detail";break;
   case"cart-add":case"cart-add-2":case"cart-update":st.cart=b.data;st.cartCount=b.data.total_items;if(id==="cart-add"){st.screen="cart";}break;
   case"cart-over":st.err=b.message+" (dikembalikan ke 3)";st.over=true;break;
   case"checkout":st.order=b.data;st.screen="order";st.cartCount=0;say("Pesanan "+b.data.order_number+" dibuat");break;
   case"checkout-again":st.err="Tap kedua ditolak: "+b.message;break;
   case"cart-empty":st.cart=b.data;st.screen="cart";break;
   case"product-after":st.detail=b.data;st.screen="detail";say("Stok sekarang "+b.data.stock);break;
   case"pay":st.payment=b.data;say("Pembayaran dibuat: "+b.data.reference);break;
   case"pay-replay":st.payment=b.data;say("Server mengembalikan pembayaran yang SAMA");break;
   case"pay-other-key":say("Ditolak: "+b.message);break;
   case"pay-success":case"pay-success-again":st.payment=b.data;st.screen="payment";break;
   case"order-paid":st.order=b.data;st.screen="order";break;
   case"orders":st.screen="orders";break;
   case"race-a":st.raceA=ok?"berhasil, "+b.data.order_number:b.message;break;
   case"race-b":st.raceB=b.message;break;
   case"race-product":st.race=b.data;break;
   case"cart-nologin":st.log=[...(st.log||[]),["e","401 "+b.message]];break;
   case"expired":st.log=[...(st.log||[]),["e","401 token kedaluwarsa → interceptor refresh…"]];setTimeout(()=>run("refresh"),900);break;
   case"refresh":st.log=[...(st.log||[]),["ok","Token baru diterima, request diulang otomatis ✓"]];break;
   case"refresh-reuse":st.log=[...(st.log||[]),["e","401 "+b.message+" → semua sesi dicabut, kembali ke login"]];break;
   case"admin-forbidden":st.err="Customer: "+b.message;break;
   case"admin-process":st.order=b.data;st.flash="Status → "+b.data.status;break;
   case"admin-invalid":st.err=b.message;break;
   case"admin-stock":st.luwak=b.data.stock;st.flash="Stok Kopi Luwak → "+b.data.stock;break;
   case"health":say("Backend sehat: database "+b.database+", redis "+b.redis);break;
  }
  render();}

/* ---------- navigation & scaling ---------- */
let cur=0;
const slides=[...document.querySelectorAll(".slide")];
function fit(){const s=Math.min(innerWidth/1080,(innerHeight-24)/1350);slides.forEach(x=>{x.style.transform=`scale(${s})`;x.style.setProperty("--s",s);});}
function show(i){cur=(i+N)%N;slides.forEach((x,k)=>x.classList.toggle("on",k===cur));try{history.replaceState(null,"","#"+(cur+1));}catch(e){}}
document.addEventListener("click",e=>{if(e.target.closest(".next"))show(cur+1);else if(e.target.closest(".prev"))show(cur-1);else{const d=e.target.closest(".dots i");if(d)show(+d.dataset.k);}});
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")show(cur+1);if(e.key==="ArrowLeft")show(cur-1);});
let sx=null;document.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;},{passive:true});
document.addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>60&&!e.target.closest(".scroll,.cbody"))show(cur+(dx<0?1:-1));sx=null;});
addEventListener("resize",fit);fit();
const h=parseInt((location.hash||"").slice(1));show(h>0?h-1:0);
})();
