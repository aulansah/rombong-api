<title>Tutorial Rombong — edisi VS Code</title>
<style>
:root{--bg:#1e1e1e;--side:#252526;--act:#333333;--title:#3c3c3c;--tab:#2d2d2d;--tabOn:#1e1e1e;--line:#3c3c3c;--fg:#d4d4d4;--muted:#858585;

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;font-size:13px;overflow:hidden}
.app{display:grid;grid-template-rows:32px 1fr 22px;height:100vh}
.titlebar{background:var(--title);display:flex;align-items:center;padding:0 12px;gap:12px;font-size:12.5px;color:#ccc;-webkit-user-select:none;user-select:none}
.dots{display:flex;gap:7px}.dots i{width:12px;height:12px;border-radius:50%;display:block}
.tcenter{flex:1;text-align:center;opacity:.85}
.tnav button{background:#505050;border:none;color:#eee;border-radius:5px;padding:3px 10px;font:inherit;cursor:pointer;margin-left:6px}
.tnav button:hover{background:#606060}
.main{display:grid;grid-template-columns:48px 300px 1fr 380px;min-height:0}
.activity{background:var(--act);display:flex;flex-direction:column;align-items:center;padding-top:6px;gap:4px}
.activity button{width:48px;height:46px;background:none;border:none;border-left:2px solid transparent;color:#858585;font-size:20px;cursor:pointer}
.activity button.on{color:#fff;border-left-color:#fff}
.sidebar{background:var(--side);display:flex;flex-direction:column;min-height:0;border-right:1px solid #1b1b1b}
.shead{padding:10px 14px 6px;font-size:11px;letter-spacing:1px;color:#bbb;text-transform:uppercase;display:flex;justify-content:space-between}
.sbody{overflow:auto;flex:1;padding-bottom:20px}
.ph{display:flex;align-items:center;gap:6px;padding:4px 10px;font-weight:700;font-size:11.5px;text-transform:uppercase;color:#ccc;cursor:pointer}
.ph .car{transition:.15s;display:inline-block}.ph.closed .car{transform:rotate(-90deg)}
.ph.closed+.phk{display:none}
.st{display:flex;align-items:center;gap:6px;padding:3px 10px 3px 22px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st:hover{background:#2a2d2e}.st.on{background:#37373d;outline:1px solid var(--acc);outline-offset:-1px}
.st .n{color:var(--muted);font-size:11px;min-width:18px}
.st .ok{color:#3fb950;margin-left:auto;font-size:12px}
.fi{display:flex;align-items:center;gap:6px;padding:2px 10px 2px 46px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#bbb;font-size:12.5px}
.fi:hover{background:#2a2d2e}.fi.on{background:#04395e;color:#fff}
.ic{font-size:10px;font-weight:800;width:16px;text-align:center;border-radius:3px}
.ic.go{color:#00add8}.ic.dart{color:#40c4ff}.ic.sql{color:#e38c00}.ic.yaml{color:#cb171e}.ic.sh{color:#89e051}.ic.make{color:#6d8086}.ic.docker{color:#2496ed}
.editor{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.tabs{display:flex;background:var(--side);height:35px;overflow-x:auto;flex:none}
.tab{display:flex;align-items:center;gap:6px;padding:0 14px;background:var(--tab);border-right:1px solid #252526;color:#969696;cursor:pointer;white-space:nowrap;font-size:13px}
.tab.on{background:var(--tabOn);color:#fff;border-top:1px solid var(--acc)}
.crumbs{height:24px;display:flex;align-items:center;padding:0 14px;color:#a9a9a9;font-size:12.5px;gap:6px;flex:none;border-bottom:1px solid #2b2b2b}
.crumbs .sep{opacity:.6}
.crumbs a{margin-left:auto;color:#3794ff;text-decoration:none;font-size:12px}
.edwrap{flex:1;min-height:0;display:flex;flex-direction:column}
.code{flex:1;overflow:auto;font-family:"JetBrains Mono",Consolas,"Courier New",monospace;font-size:13px;line-height:19px;padding:6px 0 40px;position:relative}
.ln{display:flex;white-space:pre}
.ln .g{width:56px;text-align:right;padding-right:18px;color:#6e7681;flex:none;-webkit-user-select:none;user-select:none}
.ln .tx{flex:1;padding-right:20px}
.ln.focus{background:rgba(63,185,80,.08)}
.ln.focus .g{color:#c6c6c6;box-shadow:inset 3px 0 0 var(--hlb)}
.ln.imp .tx{text-decoration:underline dotted #4fc1ff;text-underline-offset:4px;cursor:help}
.ln.flash{animation:flash 1.2s}
@keyframes flash{0%{background:rgba(0,122,204,.45)}100%{background:transparent}}
.k{color:var(--kw)}.c{color:var(--com);font-style:italic}.s{color:var(--str)}.n{color:var(--num)}.f{color:var(--fn)}.t{}.l{color:var(--lit)}.y{color:var(--key)}
span.t{color:var(--ty)}
mark.sym{background:rgba(255,215,0,.28);color:inherit;border-radius:2px;outline:1px solid rgba(255,215,0,.6)}
.welcome{padding:40px 50px;overflow:auto;flex:1;font-size:14px;line-height:1.7;max-width:880px}
.welcome h1{font-weight:300;font-size:30px;margin:0 0 4px;color:#fff}
.welcome h2{font-weight:400;color:#fff;font-size:18px;margin:26px 0 8px}
.welcome li{margin:4px 0}
.welcome code,.panel code{background:#2d2d2d;color:#d7ba7d;padding:1px 5px;border-radius:3px;font-family:"JetBrains Mono",Consolas,monospace;font-size:12px}
.bottom{height:210px;flex:none;border-top:1px solid var(--line);display:flex;flex-direction:column;background:#1e1e1e}
.btabs{display:flex;gap:18px;padding:0 16px;height:32px;align-items:center;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#969696;flex:none}
.btabs span{cursor:pointer;padding:7px 0;border-bottom:1px solid transparent}.btabs span.on{color:#e7e7e7;border-bottom-color:#e7e7e7}
.btabs .cnt{background:#4d4d4d;border-radius:8px;padding:0 6px;margin-left:4px;font-size:10px;color:#fff}
.bbody{flex:1;overflow:auto;padding:4px 16px 12px;font-family:"JetBrains Mono",Consolas,monospace;font-size:12.5px;line-height:1.6}
.term .cmt{color:#6a9955}.term .pr{color:#3fb950}.term .pa{color:#3794ff}
.tblock{margin-bottom:10px}.tblock .lab{color:#858585;display:flex;justify-content:space-between;align-items:center}
.cp{background:#0e639c;color:#fff;border:none;border-radius:3px;padding:2px 10px;font:inherit;font-size:11px;cursor:pointer}
.cp.ok{background:#3fb950}
.prob{display:flex;gap:8px;margin:6px 0;font-family:-apple-system,"Segoe UI",sans-serif;font-size:13px}.prob .w{color:#cca700}
.panel{background:var(--side);border-left:1px solid #1b1b1b;display:flex;flex-direction:column;min-height:0}
.pbody{overflow:auto;flex:1;padding:4px 16px 30px;font-size:13px;line-height:1.6}
.pstep{color:#3794ff;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin-top:6px}
.pbody h3{margin:2px 0 8px;font-size:17px;color:#fff;font-weight:600}
.box{border-radius:6px;padding:9px 11px;margin:10px 0;font-size:12.8px}
.box.why{background:#1b3a4b;border-left:3px solid #3794ff}
.box.ok{background:#1f3a24;border-left:3px solid #3fb950}
.pbody ul{padding-left:18px;margin:8px 0}
.sec{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#bbb;margin:16px 0 6px;display:flex;justify-content:space-between}
.libc{background:#1e1e1e;border:1px solid #333;border-radius:6px;padding:9px 11px;margin:8px 0}
.libc .lt{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.libc b{color:#4ec9b0}
.badge{font-size:10px;padding:1px 7px;border-radius:8px;font-weight:700}
.b-ext{background:#0e639c;color:#fff}.b-std{background:#4d4d4d;color:#ddd}.b-int{background:#6a3d9a;color:#fff}.b-tool{background:#8a5a00;color:#fff}
.libc .pp{color:#cfcfcf;margin-top:4px;font-size:12.5px}
.libc .an{color:#9d9d9d;font-size:12px;margin-top:3px}

.navbtns{display:flex;gap:6px;margin:14px 0 4px}
.navbtns button,.donebtn{flex:1;background:#3a3d41;border:none;color:#fff;padding:7px;border-radius:4px;cursor:pointer;font:inherit}
.navbtns button.pri,.donebtn{background:#0e639c}
.donebtn.is{background:#3fb950}
.status{background:var(--acc);color:#fff;display:flex;align-items:center;gap:16px;padding:0 10px;font-size:12px;white-space:nowrap;overflow:hidden}
.status .r{margin-left:auto;display:flex;gap:16px}
.tip{position:fixed;z-index:50;max-width:380px;background:#252526;border:1px solid #454545;box-shadow:0 4px 18px rgba(0,0,0,.5);border-radius:4px;padding:10px 12px;font-size:12.5px;line-height:1.55;display:none;pointer-events:none}
.tip b{color:#4ec9b0}.tip code{background:#333;color:#d7ba7d;padding:0 4px;border-radius:3px}
.hint{color:#858585;font-size:12px;margin-top:4px}
::-webkit-scrollbar{width:12px;height:12px}::-webkit-scrollbar-thumb{background:rgba(121,121,121,.4)}::-webkit-scrollbar-track{background:transparent}

 class=\"k\">return<\/span> <span class=\"l\">nil<\/span>, <span class=\"l\">false<\/span>, apperror.<span class=\"f\">BadRequest<\/span>(<span class=\"s\">&quot;Idempotency-Key header is required&quot;<\/span>)", "    }", "    <span class=\"k\">if<\/span> <span class=\"f\">len<\/span>(key) &gt; <span class=\"n\">100<\/span> {", "        <span class=\"k\">return<\/span> <span class=\"l\">nil<\/span>, <span class=\"l\">false<\/span>, apperror.<span class=\"f\">BadRequest<\/span>(<span class=\"s\">&quot;Idempotency-Key must be at most 100 characters&quot;<\/span>)", "    }", "    orderID, err := uuid.<span class=\"f\">Parse<\/span>(req.<span class=\"t\">OrderID<\/span>)", "    <span class=\"k\">if<\/span> err != <span class=\"l\">nil<\/span> {", "        <span class=\"k\">return<\/span> <span class=\"l\">nil<\/span>, <span class=\"l\">false<\/span>, apperror.<span class=\"f\">BadRequest<\/span>(<span class=\"s\">&quot;Invalid order_id&quot;<\/span>)", "    }", " ", "    o, err := s.<span class=\"f\">ownedOrder<\/span>(ctx, caller, orderID)", "    <span class=\"k\">if<\/span> err != <span class=\"l\">nil<\/span> {", "        <span class=\"k\">return<\/span> <span class=\"l\">nil<\/span>, <span class=\"l\">false<\/span>, err", "    }", " ", "    <span class=\"k\">if<\/span> existing, err := s.<span class=\"f\">replay<\/span>(ctx, key, orderID); err != <span class=\"l\">nil<\/span> || existing != <span class=\"l\">nil<\/span> {", "        <span class=\"k\">return<\/span> existing, <span class=\"l\">false<\/span>, err", "    }", " ", "    <span class=\"k\">if<\/span> o.<span class=\"t\">Status<\/span> != order.<span class=\"t\">StatusPending<\/span> {", "        <span class=\"k\">return<\/span> <span class=\"l\">nil<\/span>, <span class=\"l\">false<\/span>, apperror.<span class=\"f\">Conflict<\/span>(fmt.<span class=\"f\">Sprintf<\/span>(<span class=\"s\">&quot;Order with status %s cannot be paid&quot;<\/span>, o.<span class=\"t\">Status<\/span>))", "    }", "    <span class=\"k\">if<\/span> existing, err := s.<span class=\"f\">activePayment<\/span>(ctx, orderID, key); err != <span class=\"l\">nil<\/span> || existing != <span class=\"l\">nil<\/span> {", "        <span class=\"k\">return<\/span> existing, <span class=\"l\">false<\/span>, err", "    }", " ", "    ref, err := <span class=\"f\">newReference<\/span>()", "    <span class=\"k\">if<\/span> err != <span class=\"l\">nil<\/span> {", "        <span class=\"k\">return<\/span> <span class=\"l\">nil<\/span>, <span class=\"l\">false<\/span>, apperror.<span class=\"f\">Internal<\/span>(err)", "    }", "    p = &amp;<span class=\"t\">Payment<\/span>{", "        <span class=\"t\">OrderID<\/span>:        orderID,", "        <span class=\"t\">Reference<\/span>:      ref,", "        <span class=\"t\">IdempotencyKey<\/span>: key,", "        <span class=\"t\">Amount<\/span>:         o.<span class=\"t\">TotalAmount<\/span>,", "        <span class=\"t\">Status<\/span>:         <span class=\"t\">StatusPending<\/span>,", "        <span class=\"t\">ExpiresAt<\/span>:      time.<span class=\"f\">Now<\/span>().<span class=\"f\">UTC<\/span>().<span class=\"f\">Add<\/span>(s.expiry),", "    }", " ", "    err = s.repo.<span class=\"f\">Create<\/span>(ctx, p)", "    <span class=\"k\">if<\/span> errors.<span class=\"f\">Is<\/span>(err, apperror.<span class=\"t\">ErrDuplicate<\/span>) {", "        <span class=\"c\">// Lost a race. Either the same key was inserted concurrently (replay<\/span>", "        <span class=\"c\">// it) or the order already has another active payment.<\/span>", "        <span class=\"k\">if<\/span> existing, rerr := s.<span class=\"f\">replay<\/span>(ctx, key, orderID); rerr != <span class=\"l\">nil<\/span> || existing != <span class=\"l\">nil<\/span> {", "            <span class=\"k\">return<\/span> existing, <span class=\"l\">false<\/span>, rerr", "        }", "        <span class=\"k\">return<\/span> <span class=\"l\">nil<\/span>, <span class=\"l\">false<\/span>, apperror.<span class=\"f\">Conflict<\/span>(<span class=\"s\">&quot;Order already has an active payment&quot;<\/span>)", "    }", "    <span class=\"k\">if<\/span> err != <span class=\"l\">nil<\/span> {", "        <span class=\"k\">return<\/span> <span class=\"l\">nil<\/span>, <span class=\"l\">false<\/span>, apperror.<span class=\"f\">Internal<\/span>(err)", "    }", "    <span class=\"k\">return<\/span> p, <span class=\"l\">true<\/span>, <span class=\"l\">nil<\/span>", "}", " ", "<span class=\"c\">// Get returns a payment if the caller owns its order (or is an admin).<\/span>", "<span class=\"k\">func<\/span> (s *<span class=\"t\">Service<\/span>) <span class=\"f\">Get<\/span>(ctx context.<span class=\"t\">Context<\/span>, caller <span class=\"t\">Caller<\/span>, id uuid.<span class=\"t\">UUID<\/span>) (*<span class=\"t\">Payment<\/span>, error) {", "    p, err := s.repo.<span class=\"f\">FindByID<\/span>(ctx, id)", "    <span class=\"k\">if<\/span> errors.<span class=\"f\">Is<\/span>(err, apperror.<span class=\"t\">ErrNotFound<\/span>) {", "        <span class=\"k\">return<\/span> <span class=\"l\">nil<\/span>, apperror.<span class=\"f\">NotFound<\/span>(<span class=\"s\">&quot;Payment not found&quot;<\/span>)", "    }", "    <span class=\"k\">if<\/span> err != <span class=\"l\">nil<\/span> {", "        <span class=\"k\">return<\/span> <span class=\"l\">nil<\/span>, apperror.<span class=\"f\">Internal<\/span>(err)", "    }", "    <span class=\"k\">if<\/span> _, err := s.<span class=\"f\">ownedOrder<\/span>(ctx, caller, p.<span class=\"t\">OrderID<\/span>); err != <span class=\"l\">nil<\/span> {", "        <span class=\"k\">return<\/span> <span class=\"l\">nil<\/span>, apperror.<span class=\"f\">NotFound<\/span>(<span class=\"s\">&quot;Payment not found&quot;<\/span>)", "    }", "    <span class=\"k\">return<\/span> p, <span class=\"l\">nil<\/span>", "}", " ", "<span class=\"c\">// SimulateSuccess marks the payment as paid and the order as PAID.<\/span>", "<span class=\"c\">//<\/span>", "<span class=\"c\">// Idempotency: calling it again on a payment that already succeeded returns<\/span>", "<span class=\"c\">// the same result without doing anything. Under concurrency, the<\/span>", "<span class=\"c\">// compare-and-swap in Transition lets exactly one request perform the<\/span>", "<span class=\"c\">// change; both updates share a transaction, so a payment is never SUCCESS<\/span>", "<span class=\"c\">// while its order is still PENDING.<\/span>", "<span class=\"k\">func<\/span> (s *<span class=\"t\">Service<\/span>) <span class=\"f\">SimulateSuccess<\/span>(ctx context.<span class=\"t\">Context<\/span>, caller <span class=\"t\">Caller<\/span>, id uuid.<span class=\"t\">UUID<\/span>) (*<span class=\"t\">Payment<\/span>, error) {", "    p, err := s.<span class=\"f\">Get<\/span>(ctx, caller, id)", "    <span class=\"k\">if<\/span> err != <span class=\"l\">nil<\/span> {", "        <span class=\"k\">return<\/span> <span class=\"l\">nil<\/span>, err", "    }", "    <span class=\"k\">switch<\/span> p.<span class=\"t\">Status<\/span> {", "    <span class=\"k\">case<\/span> <span class=\"t\">StatusSuccess<\/span>:", "        <span class=\"k\">return<\/span> p, <span class=\"l\">nil<\/span>", "    <span class=\"k\">case<\/span> <span class=\"t\">StatusFailed<\/span>, <span class=\"t\">StatusExpired<\/span>:", "        <span class=\"k\">return<\/span> <span class=\"l\">nil<\/span>, apperror.<span class=\"f\">Conflict<\/span>(fmt.<span class=\"f\">Sprintf<\/span>(<span class=\"s\">&quot;Payment is already %s&quot;<\/span>, p.<span class=\"t\">Status<\/span>))", "    }", "    <span class=\"k\">if<\/span> time.<span class=\"f\">Now<\/span>().<span class=\"f\">After<\/span>(p.<span class=\"t\">ExpiresAt<\/span>) {", "        <span class=\"k\">if<\/span> _, err := s.repo.<span class=\"f\">Transition<\/span>(ctx, p.<span class=\"t\">ID<\/span>, <span class=\"t\">StatusExpired<\/span>, <span class=\"l\">nil<\/span>); err != <span class=\"l\">nil<\/span> {", "            <span class=\"k\">return<\/span> <span class=\"l\">nil<\/span>, apperror.<span class=\"f\">Internal<\/span>(err)", "        }", "        <span class=\"k\">return<\/span> <span class=\"l\">nil<\/span>, apperror.<span class=\"f\">Conflict<\/span>(<span class=\"s\">&quot;Payment has expired, please create a new payment&quot;<\/span>)", "    }", " ", "    alreadyProcessed := <span class=\"l\">false<\/span>", "    err = s.tx.<span class=\"f\">WithinTx<\/span>(ctx, <span class=\"k\">func<\/span>(ctx context.<span class=\"t\">Context<\/span>) error {", "        now := time.<span class=\"f\">Now<\/span>().<span class=\"f\">UTC<\/span>()", "        ok, err := s.repo.<span class=\"f\">Transition<\/span>(ctx, p.<span class=\"t\">ID<\/span>, <span class=\"t\">StatusSuccess<\/span>, &amp;now)", "        <span class=\"k\">if<\/span> err != <span class=\"l\">nil<\/span> {", "            <span class=\"k\">return<\/span> err", "        }", "        <span class=\"k\">if<\/span> !ok {", "            alreadyProcessed = <span class=\"l\">true<\/span>", "            <span class=\"k\">return<\/span> <span class=\"l\">nil<\/span>", "        }", "        paid, err := s.orders.<span class=\"f\">TransitionStatus<\/span>(ctx, p.<span class=\"t\">OrderID<\/span>, order.<span class=\"t\">StatusPending<\/span>, order.<span class=\"t\">StatusPaid<\/span>)", "        <span class=\"k\">if<\/span> err != <span class=\"l\">nil<\/span> {", "            <span class=\"k\">return<\/span> err", "        }", "        <span class=\"k\">if<\/span> !paid {", "            <span class=\"c\">// The order was cancelled in the meantime. Returning an error<\/span>", "            <span class=\"c\">// rolls the payment back to PENDING.<\/span>", "            <span class=\"k\">return<\/span> apperror.<span class=\"f\">Conflict<\/span>(<span class=\"s\">&quot;Order is no longer awaiting payment&quot;<\/span>)", "        }", "        <span class=\"k\">return<\/span> <span class=\"l\">nil<\/span>", "    })", "    <span class=\"k\">if<\/span> err != <span class=\"l\">nil<\/span> {", "        <span class=\"k\">return<\/span> <span class=\"l\">nil<\/span>, <span class=\"f\">wrap<\/span>(err)", "    }", " ", "    current, err := s.<span class=\"f\">Get<\/span>(ctx, caller, id)", "    <span class=\"k\">if<\/span> err != <span class=\"l\">nil<\/span> {", "        <span class=\"k\">return<\/span> <span class=\"l\">nil<\/span>, err", "    }", "    <span class=\"k\">if<\/span> alreadyProcessed &amp;&amp; current.<span class=\"t\">Status<\/span> != <span class=\"t\">StatusSuccess<\/span> {", "        <span class=\"k\">return<\/span> <span class=\"l\">nil<\/span>, apperror.<span class=\"f\">Conflict<\/span>(fmt.<span class=\"f\">Sprintf<\/span>(<span class=\"s\">&quot;Payment is already %s&quot;<\/span>, current.<span class=\"t\">Status<\/span>))", "    }", "    <span class=\"k\">return<\/span> current, <span class=\"l\">nil<\/span>", "}", " ", "<span class=\"c\">// SimulateFailure marks the payment as FAILED. The order stays PENDING so<\/span>", "<span class=\"c\">// the customer can try again with a new payment.<\/span>", "<span class=\"k\">func<\/span> (s *<span class=\"t\">Service<\/span>) <span class=\"f\">SimulateFailure<\/span>(ctx context.<span class=\"t\">Context<\/span>, caller <span class=\"t\">Caller<\/span>, id uuid.<span class=\"t\">UUID<\/span>) (*<span class=\"t\">Payment<\/span>, error) {", "    p, err := s.<span class=\"f\">Get<\/span>(ctx, caller, id)", "    <span class=\"k\">if<\/span> err != <span class=\"l\">nil<\/span> {", "        <span class=\"k\">return<\/span> <span class=\"l\">nil<\/span>, err", "    }", "    <span class=\"k\">switch<\/span> p.<span class=\"t\">Status<\/span> {", "    <span class=\"k\">case<\/span> <span class=\"t\">StatusFailed<\/span>:", "        <span class=\"k\">return<\/span> p, <span class=\"l\">nil<\/span>", "    <span class=\"k\">case<\/span> <span class=\"t\">StatusSuccess<\/span>, <span class=\"t\">StatusExpired<\/span>:", "        <span class=\"k\">return<\/span> <span class=\"l\">nil<\/span>, apperror.<span class=\"f\">Conflict<\/span>(fmt.<span class=\"f\">Sprintf<\/span>(<span class=\"s\">&quot;Payment is already %s&quot;<\/span>, p.<span class=\"t\">Status<\/span>))", "    }", " ", "    ok, err := s.repo.<span class=\"f\">Transition<\/span>(ctx, p.<span class=\"t\">ID<\/span>, <span class=\"t\">StatusFailed<\/span>, <span class=\"l\">nil<\/span>)", "    <span class=\"k\">if<\/span> err != <span class=\"l\">nil<\/span> {", "        <span class=\"k\">return<\/span> <span class=\"l\">nil<\/span>, apperror.<span class=\"f\">Internal<\/span>(err)", "    }", "    current, err := s.<span class=\"f\">Get<\/span>(ctx, caller, id)", "    <span class=\"k\">if<\/span> err != <span class=\"l\">nil<\/span> {", "        <span class=\"k\">return<\/span> <span class=\"l\">nil<\/span>, err", "    }", "    <span class=\"k\">if<\/span> !ok &amp;&amp; current.<span class=\"t\">Status<\/span> != <span class=\"t\">StatusFailed<\/span> {", "        <span class=\"k\">return<\/span> <span class=\"l\">nil<\/span>, apperror.<span class=\"f\">Conflict<\/span>(fmt.<span class=\"f\">Sprintf<\/span>(<span class=\"s\">&quot;Payment is already %s&quot;<\/span>, current.<span class=\"t\">Status<\/span>))", "    }", "    <span class=\"k\">return<\/span> current, <span class=\"l\">nil<\/span>", "}", " ", "<span class=\"c\">// replay returns the payment previously created with this key, or nil.<\/span>", "<span class=\"c\">// Reusing a key for a different order is a client bug and is rejected.<\/span>", "<span class=\"k\">func<\/span> (s *<span class=\"t\">Service<\/span>) <span class=\"f\">replay<\/span>(ctx context.<span class=\"t\">Context<\/span>, key string, orderID uuid.<span class=\"t\">UUID<\/span>) (*<span class=\"t\">Payment<\/span>, error) {", "    existing, err := s.repo.<span class=\"f\">FindByIdempotencyKey<\/span>(ctx, key)", "    <span class=\"k\">if<\/span> errors.<span class=\"f\">Is<\/span>(err,    run<\/span>: go vet -tags integration ./...", " ", "<span class=\"y\">      - name<\/span>: Unit tests", "<span class=\"y\">        run<\/span>: go test -race -count=<span class=\"n\">1<\/span> ./...", " ", "<span class=\"y\">      - name<\/span>: Integration tests", "<span class=\"y\">        env<\/span>:", "<span class=\"y\">          TEST_DB_HOST<\/span>: localhost", "<span class=\"y\">          TEST_DB_PORT<\/span>: <span class=\"s\">&quot;5432&quot;<\/span>", "<span class=\"y\">        run<\/span>: go test -tags integration -race -count=<span class=\"n\">1<\/span> ./tests/...", " ", "<span class=\"y\">      - name<\/span>: Build", "<span class=\"y\">        run<\/span>: go build ./cmd/api"], "imports": {}, "libs": [{"name": "actions/checkout", "kind": "tool", "purpose": "Mengambil kode repo ke mesin CI.", "analogy": "", "used": [], "imp": ""}, {"name": "actions/setup-go", "kind": "tool", "purpose": "Memasang Go di mesin CI.", "analogy": "", "used": [], "imp": ""}, {"name": "services: postgres", "kind": "tool", "purpose": "Menyalakan PostgreSQL sementara untuk integration test.", "analogy": "", "used": [], "imp": ""}], "gh": "https://github.com/aulansah/rombong-api/blob/main/.github/workflows/go-ci.yml"}, "fe:.github/workflows/flutter-ci.yml": {"path": ".github/workflows/flutter-ci.yml", "repo": "fe", "lang": "yaml", "html": ["<span class=\"y\">name<\/span>: Flutter CI", " ", "<span class=\"y\">on<\/span>:", "<span class=\"y\">  push<\/span>:", "<span class=\"y\">    branches<\/span>: [main, develop]", "<span class=\"y\">  pull_request<\/span>:", " ", "<span class=\"y\">jobs<\/span>:", "<span class=\"y\">  analyze-and-test<\/span>:", "<span class=\"y\">    runs-on<\/span>: ubuntu-latest", "<span class=\"y\">    steps<\/span>:", "<span class=\"y\">      - uses<\/span>: actions/checkout@v4", " ", "<span class=\"y\">      - uses<\/span>: subosito/flutter-action@v2", "<span class=\"y\">        with<\/span>:", "<span class=\"y\">          channel<\/span>: stable", <script>
(function(){
const D=JSON.parse(document.getElementById("data").textContent);
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY="ecom-tutorial-done";let done={};try{done=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}};
const LANG={go:"Go",dart:"Dart",sql:"SQL",yaml:"YAML",sh:"Plain Text",make:"Makefile",docker:"Dockerfile"};
const ICON={go:"GO",dart:"◆",sql:"DB",yaml:"!",sh:"$",make:"M",docker:"🐳"};
let cur=0, curFile=0, bottomTab="term", sym=null;

/* ---------- tree ---------- */
function buildTree(){
 const t=$("#tree");t.innerHTML="";let n=0;
 D.phases.forEach(([pk,pnum,pname])=>{
  const ph=document.createElement("div");ph.className="ph";ph.innerHTML=`<span class="car">▾</span> ${pnum}. ${esc(pname)}`;t.appendChild(ph);
  const box=document.createElement("div");box.className="phk";t.appendChild(box);ph.onclick=()=>ph.classList.toggle("closed");
  D.steps.forEach((s,i)=>{if(s.phase!==pk)return;n++;
   const st=document.createElement("div");st.className="st";st.dataset.i=i;
   st.innerHTML=`<span class="n">${i+1}</span><span>${esc(s.title)}</span><span class="ok">${done["s"+(i+1)]?"✓":""}</span>`;
   st.onclick=()=>open(i,0);box.appendChild(st);
   s.files.forEach((f,j)=>{const F=D.files[f.key];const fi=document.createElement("div");fi.className="fi";fi.dataset.i=i;fi.dataset.j=j;
    fi.innerHTML=`<span class="ic ${F.lang}">${ICON[F.lang]}</span>${esc(F.path.split("/").pop())}`;fi.title=F.path;fi.onclick=e=>{e.stopPropagation();open(i,j);};box.appendChild(fi);});
  });
 });
}
/* ---------- editor ---------- */
function open(i,j){
 cur=i;curFile=j||0;sym=null;const s=D.steps[i];
 document.querySelectorAll(".st").forEach(x=>x.classList.toggle("on",+x.dataset.i===i));
 document.querySelectorAll(".fi").forEach(x=>x.classList.toggle("on",+x.dataset.i===i&&+x.dataset.j===curFile));
 const sel=document.querySelector(".st.on");if(sel)sel.scrollIntoView({block:"nearest"});
 // tabs
 const tabs=$("#tabs");tabs.innerHTML="";
 if(!s.files.length){tabs.innerHTML=`<div class="tab on">📘 Langkah ${i+1}.md</div>`;}
 s.files.forEach((f,k)=>{const F=D.files[f.key];const t=document.createElement("div");t.className="tab"+(k===curFile?" on":"");
  t.innerHTML=`<span class="ic ${F.lang}">${ICON[F.lang]}</span>${esc(F.path.split("/").pop())}`;t.onclick=()=>open(i,k);tabs.appendChild(t);});
 const repo=s.files[curFile]?D.files[s.files[curFile].key].repo:null;
 $("#ttitle").textContent=(repo==="fe"?"rombong-app":repo==="be"?"rombong-api":"ecommerce")+" — Langkah "+(i+1)+": "+s.title;
 $("#sbBranch").textContent=D.branch[s.phase];
 $("#sbStep").textContent="Langkah "+(i+1)+"/"+D.steps.length+(s.time?" · ⏱ "+s.time:"");
 if(!s.files.length){renderWelcome(s,i);}else{renderFile(s,s.files[curFile]);}
 renderPanel();renderBottom();paintDone();
 try{history.replaceState(null,"","#"+(i+1)+(curFile?"-"+(curFile+1):""));}catch(e){}
}
function renderWelcome(s,i){
 $("#crumbs").innerHTML=`<span>Tutorial</span><span class="sep">›</span><span>Langkah ${i+1}.md</span>`;
 $("#sbLn").textContent="";$("#sbLang").textContent="Markdown";
 $("#edwrap").innerHTML=`<div class="welcome"><h1>${esc(s.title)}</h1><p style="color:#9d9d9d">${s.goal}</p>
  ${s.explain.length?`<h2>Yang perlu disiapkan</h2><ul>${s.explain.map(x=>"<li>"+x+"</li>").join("")}</ul>`:""}
  ${s.check?`<h2>✅ Cek berhasil</h2><p>${s.check}</p>`:""}
  <h2>Tentang edisi VS Code ini</h2><ul><li>Kiri: <b>Explorer</b>, berisi langkah dan file. Klik file untuk membukanya.</li><li>Tengah: file <b>lengkap</b> dari repo; baris <span style="color:#3fb950">bergaris hijau</span> adalah bagian yang dibahas.</li><li>Arahkan kursor ke baris <u style="text-decoration-style:dotted;text-decoration-color:#4fc1ff">import</u> untuk melihat kegunaan library.</li><li>Kanan: <b>Penjelasan</b>, berisi tujuan, alasan, dan library. Klik chip seperti <code>fiber.Ctx</code> untuk menyorotnya di kode.</li><li>Bawah: <b>Terminal</b> berisi perintah yang bisa disalin, <b>Problems</b> berisi error yang sering muncul, dan <b>Output</b> berisi cara cek berhasil.</li><li>Navigasi: tombol ◀ ▶ di atas, atau <code>Alt+←</code> / <code>Alt+→</code>.</li></ul></div>`;
}
function renderFile(s,f){
 const F=D.files[f.key];
 const segs=F.path.split("/");
 $("#crumbs").innerHTML=`<span>${F.repo==="be"?"rombong-api":"rombong-app"}</span>`+segs.map(x=>`<span class="sep">›</span><span>${esc(x)}</span>`).join("")+`<a href="${F.gh}" target="_blank" rel="noopener">Buka di GitHub ↗</a>`;
 $("#sbLang").textContent=LANG[F.lang];$("#sbLn").textContent="Ln "+f.start+"–"+f.end;
 const lines=F.html.map((h,k)=>{const no=k+1;const foc=no>=f.start&&no<=f.end;const imp=F.imports[no]!==undefined;
  return `<div class="ln${foc?" focus":""}${imp?" imp":""}" data-no="${no}"${imp?` data-lib="${F.imports[no]}"`:""}><span class="g">${no}</span><span class="tx">${h}</span></div>`;}).join("");
 $("#edwrap").innerHTML=`<div class="code" id="code">${lines}</div>`;
 const code=$("#code");
 const target=code.querySelector(`.ln[data-no="${Math.max(1,f.start-3)}"]`);
 if(target)code.scrollTop=target.offsetTop-8;
 code.addEventListener("mousemove",ev=>{const ln=ev.target.closest(".ln.imp");const tip=$("#tip");
  if(!ln){tip.style.display="none";return;}const L=F.libs[+ln.dataset.lib];if(!L){tip.style.display="none";return;}
  tip.innerHTML=`<b>${esc(L.name)}</b> <span class="badge b-${L.kind}">${{ext:"library luar",std:"bawaan bahasa",int:"buatan sendiri",tool:"alat"}[L.kind]}</span><div style="margin-top:4px">${L.purpose}</div>${L.analogy?`<div style="color:#9d9d9d;margin-top:3px">🍽️ ${esc(L.analogy)}</div>`:""}`;
  tip.style.display="block";const x=Math.min(ev.clientX+14,window.innerWidth-400),y=Math.min(ev.clientY+14,window.innerHeight-160);tip.style.left=x+"px";tip.style.top=y+"px";});
 code.addEventListener("mouseleave",()=>$("#tip").style.display="none");
 code.addEventListener("mouseover",ev=>{const ln=ev.target.closest(".ln");if(ln)$("#sbLn").textContent="Ln "+ln.dataset.no;});
}
function highlightSym(name){
 const code=$("#code");if(!code)return;
 code.querySelectorAll("mark.sym").forEach(m=>{m.replaceWith(document.createTextNode(m.textContent));});
 code.normalize();
 document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c.dataset.sym===name&&sym!==null));
 if(!name)return;
 const short=name.includes(".")&&!name.startsWith("ref.")&&!name.startsWith("context.")&&!name.startsWith("_storage.")&&!name.startsWith("state.")?name:name.replace(/\($/,"");
 const parts=short.split(".");let first=null;
 code.querySelectorAll(".ln").forEach(ln=>{const txt=ln.querySelector(".tx").textContent;if(!txt.includes(parts[parts.length-1]))return;
  if(parts.length>1&&!txt.replace(/\s/g,"").includes(short.replace(/\s/g,"")))return;
  const walker=document.createTreeWalker(ln.querySelector(".tx"),NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
  const lastPart=parts[parts.length-1];
  nodes.forEach(nd=>{const idx=nd.textContent.indexOf(lastPart);if(idx<0)return;const r=document.createRange();r.setStart(nd,idx);r.setEnd(nd,idx+lastPart.length);const m=document.createElement("mark");m.className="sym";try{r.surroundContents(m);}catch(e){}});
  if(!first)first=ln;});
 if(first){first.classList.remove("flash");void first.offsetWidth;first.classList.add("flash");code.scrollTop=first.offsetTop-80;}
}
/* ---------- panel ---------- */
function renderPanel(){
 const s=D.steps[cur];const f=s.files[curFile];
 let libs="";
 if(f){const ext=f.libs.filter(l=>l.kind!=="int"),own=f.libs.filter(l=>l.kind==="int");
  libs=`<div class="sec"><span>📚 Library di ${esc(D.files[f.key].path.split("/").pop())}</span><span>${ext.length}</span></div>`+
  (ext.length?ext.map(l=>`<div class="libc"><div class="lt"><b>${esc(l.name)}</b><span class="badge b-${l.kind}">${{ext:"library luar",std:"bawaan",tool:"alat"}[l.kind]||""}</span></div><div class="pp">${l.purpose}</div>${l.analogy?`<div class="an">🍽️ ${esc(l.analogy)}</div>`:""}${l.used.length?`<div class="chips">${l.used.map(u=>`<span class="chip" data-sym="${esc(u)}">${esc(u)}</span>`).join("")}</div>`:`<div class="an">Diimpor di file ini; tidak muncul di bagian yang disorot.</div>`}</div>`).join(""):`<div class="hint">Tidak ada library luar di file ini.</div>`)+
  (own.length?`<div class="libc"><div class="lt"><b>Paket/file buatan sendiri</b><span class="badge b-int">project</span></div><div class="chips">${own.map(l=>`<span class="chip" style="color:#c586c0;cursor:default">${esc(l.name)}</span>`).join("")}</div></div>`:"")+
  `<div class="hint">Klik chip untuk menyorot pemakaiannya di kode. Arahkan kursor ke baris import untuk penjelasan singkat.</div>`;}
 $("#pbody").innerHTML=`<div class="pstep">Langkah ${cur+1} dari ${D.steps.length}${s.time?" · ⏱ "+esc(s.time):""}</div><h3>${esc(s.title)}</h3>
  <div>${s.goal}</div>${s.why?`<div class="box why">💡 <b>Kenapa begini:</b> ${s.why}</div>`:""}
  ${f&&f.title?`<div class="sec"><span>📄 File ini</span></div><div><code>${esc(D.files[f.key].path)}</code><br>${esc(f.title)} · baris ${f.start}–${f.end}</div>`:""}
  ${s.files.length&&s.explain.length?`<div class="sec"><span>📝 Catatan</span></div><ul>${s.explain.map(x=>"<li>"+x+"</li>").join("")}</ul>`:""}
  ${libs}
  ${s.check?`<div class="box ok">✅ <b>Cek berhasil:</b> ${s.check}</div>`:""}
  <button class="donebtn${done["s"+(cur+1)]?" is":""}" id="doneB">${done["s"+(cur+1)]?"✓ Langkah selesai":"Tandai langkah selesai"}</button>
  <div class="navbtns"><button id="pp">◀ Sebelumnya</button><button class="pri" id="pn">Berikutnya ▶</button></div>`;
 $("#pbody").scrollTop=0;
 $("#pbody").querySelectorAll(".chip[data-sym]").forEach(c=>c.onclick=()=>{const n=c.dataset.sym;sym=sym===n?null:n;highlightSym(sym);});
 $("#doneB").onclick=()=>{const k="s"+(cur+1);done[k]=!done[k];save();renderPanel();paintDone();};
 $("#pp").onclick=prev;$("#pn").onclick=next;
}
/* ---------- bottom ---------- */
function renderBottom(){
 const s=D.steps[cur];
 $("#pc").textContent=s.errors.length;
 document.querySelectorAll(".btabs span").forEach(x=>x.classList.toggle("on",x.dataset.b===bottomTab));
 const b=$("#bbody");
 if(bottomTab==="term"){
  b.className="bbody term";
  b.innerHTML=s.cmds.length?s.cmds.map(([lab,cmd],k)=>`<div class="tblock"><div class="lab"><span># ${esc(lab)}</span><button class="cp" data-k="${k}">Salin</button></div>${cmd.split("\n").map(l=>l.trim().startsWith("#")||l.trim()===""?`<div class="cmt">${esc(l)||"&nbsp;"}</div>`:`<div><span class="pr">➜</span> <span class="pa">~/project</span> ${esc(l).replace(/(#.*)$/,'<span class="cmt">$1</span>')}</div>`).join("")}</div>`).join(""):`<div class="cmt"># Tidak ada perintah terminal di langkah ini. Fokus ke kode di editor.</div>`;
  b.querySelectorAll(".cp").forEach(btn=>btn.onclick=async()=>{const t=s.cmds[+btn.dataset.k][1];try{await navigator.clipboard.writeText(t)}catch(e){const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy")}catch(_){}ta.remove();}btn.textContent="Tersalin ✓";btn.classList.add("ok");setTimeout(()=>{btn.textContent="Salin";btn.classList.remove("ok")},1400);});
 }else if(bottomTab==="prob"){
  b.className="bbody";
  b.innerHTML=s.errors.length?s.errors.map(([a,c])=>`<div class="prob"><span class="w">⚠</span><div><code>${esc(a)}</code><div style="color:#bbb">${c}</div></div></div>`).join(""):`<div class="prob" style="color:#858585">Tidak ada masalah umum yang tercatat untuk langkah ini.</div>`;
 }else{
  b.className="bbody";b.innerHTML=`<div class="prob"><span style="color:#3fb950">✓</span><div>${s.check||"Lanjutkan ke langkah berikutnya."}</div></div>`;
 }
}
document.querySelectorAll(".btabs span").forEach(x=>x.onclick=()=>{bottomTab=x.dataset.b;renderBottom();});
function paintDone(){const c=Object.values(done).filter(Boolean).length;$("#prog").textContent=c+"/"+D.steps.length+" ✓";$("#sbDone").textContent="✓ "+c+"/"+D.steps.length+" selesai";
 document.querySelectorAll(".st").forEach(x=>x.querySelector(".ok").textContent=done["s"+(+x.dataset.i+1)]?"✓":"");}
function next(){const s=D.steps[cur];if(curFile<s.files.length-1)open(cur,curFile+1);else if(cur<D.steps.length-1)open(cur+1,0);}
function prev(){if(curFile>0)open(cur,curFile-1);else if(cur>0){const p=D.steps[cur-1];open(cur-1,Math.max(0,p.files.length-1));}}
$("#nextB").onclick=next;$("#prevB").onclick=prev;
document.addEventListener("keydown",e=>{if(e.altKey&&e.key==="ArrowRight"){e.preventDefault();next();}if(e.altKey&&e.key==="ArrowLeft"){e.preventDefault();prev();}});
$("#mExplorer").onclick=()=>$("#sidebar").classList.toggle("mob");$("#mPanel").onclick=()=>$("#panel").classList.toggle("mob");$("#pclose").onclick=()=>$("#panel").classList.remove("mob");
$("#searchBtn").onclick=()=>{const q=prompt("Cari langkah atau file:");if(!q)return;const ql=q.toLowerCase();
 for(let i=0;i<D.steps.length;i++){const s=D.steps[i];if(s.title.toLowerCase().includes(ql))return open(i,0);const j=s.files.findIndex(f=>D.files[f.key].path.toLowerCase().includes(ql));if(j>=0)return open(i,j);}alert("Tidak ditemukan");};
buildTree();
let start=0,sf=0;const h=(location.hash||"").slice(1).split("-");if(+h[0]>0){start=Math.min(+h[0]-1,D.steps.length-1);sf=+(h[1]||1)-1;}
open(start,Math.max(0,sf));
})();
</script></body></html>
